[package]
name = "amps"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Private seven-bus Windows audio router for streaming and isolated voice mixes"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fs2 = "0.4"
tempfile = "3"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
cpal = "0.16"
crossbeam-queue = "0.3"
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet.git", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract", "default-model"] }
libloading = "0.8"
ndarray = "0.15"
wasapi = "0.23"
winreg = "0.55"
windows = { version = "0.54", features = [
  "implement",
  "Devices_Enumeration",
  "Foundation",
  "Foundation_Collections",
  "Media_Audio",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
] }
# DeepFilterNet's current source is tested against tract 0.21.4. Its caret
# requirements otherwise resolve to newer 0.21.x releases whose ndarray ABI is
# incompatible with this model runtime. Keep the complete tract family unified
# on the upstream-tested release until DeepFilterNet updates its dependency.
tract-core = "=0.21.4"
tract-hir = "=0.21.4"
tract-onnx = "=0.21.4"
tract-pulse = "=0.21.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
